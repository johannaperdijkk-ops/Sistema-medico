<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Medical Appointment System</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <div class="container">
    <header>
      <h1>Medical Appointment System</h1>
      <p>Secure prototype for managing medical appointments</p>
    </header>

    <section class="card">
      <h2>Doctors</h2>
      <button id="loadDoctorsBtn" type="button">Load Doctors</button>
      <ul id="doctorList"></ul>
    </section>

    <section class="card">
      <h2>Create Appointment</h2>

      <input type="text" id="patient" placeholder="Patient name" />
      <input type="text" id="doctor" placeholder="Doctor name" />
      <input type="date" id="date" />
      <input type="time" id="time" />

      <button id="createAppointmentBtn" type="button">Create Appointment</button>
      <p id="message"></p>
    </section>

    <section class="card">
      <h2>Appointments</h2>
      <button id="refreshAppointmentsBtn" type="button">Refresh Appointments</button>
      <ul id="appointmentList"></ul>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
